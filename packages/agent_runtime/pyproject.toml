[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "Observation-to-action-proposal policies for persistent NPCs"
requires-python = ">=3.12,<3.14"
dependencies = [
    "world-core",
    "pydantic>=2.9",
    "httpx>=0.28",
]

[tool.uv.sources]
world-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]
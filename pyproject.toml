[project]
name = "unwritten-dao"
version = "0.1.0"
description = "Deterministic emergent-narrative xianxia world simulation MVP"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a live PostgreSQL instance",
    "slow: long-running simulation",
]
filterwarnings = ["error::DeprecationWarning:world_core.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "services", "tests", "tools"]
extend-exclude = [".qoder"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["world_core", "agent_runtime", "world_server"]
mypy_path = [
    "packages/world_core/src",
    "packages/agent_runtime/src",
    "services/world_server/src",
]

[tool.coverage.run]
source = ["world_core", "agent_runtime", "world_server"]
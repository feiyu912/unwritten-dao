openapi: 3.1.0
info:
  title: Unwritten Dao World API
  version: "1.1.0"
  description: >
    Versioned contract between the authoritative world server and any client.
    Clients submit commands and read authoritative state; they never simulate
    training, combat, death, or ownership locally.
servers:
  - url: http://127.0.0.1:8000
paths:
  /v1/health:
    get:
      operationId: health
      responses:
        "200":
          description: Service and database status
          content:
            application/json:
              schema:
                type: object
                required: [status, world_loaded]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  world_loaded: { type: boolean }

  /v1/world/snapshot:
    get:
      operationId: getWorldSnapshot
      responses:
        "200":
          description: Current authoritative snapshot
          content:
            application/json:
              schema:
                $ref: "./world-snapshot.v1.schema.json"

  /v1/world/events:
    get:
      operationId: listWorldEvents
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: type
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Events ordered by event_id
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "./world-event.v1.schema.json"

  /v1/npcs/{npc_id}:
    get:
      operationId: getNpc
      parameters:
        - name: npc_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Public authoritative NPC state
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/npcs/{npc_id}/observation:
    get:
      operationId: getNpcObservation
      description: Knowledge-bounded observation; never includes hidden truth.
      parameters:
        - name: npc_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Observation for the NPC
          content:
            application/json:
              schema:
                $ref: "./npc-observation.v1.schema.json"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/commands:
    post:
      operationId: submitCommand
      description: >
        Submit an idempotent world command. Expected state version must match;
        stale commands are rejected with 409. LLM-authored proposals must be
        validated before reaching this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./world-command.v1.schema.json"
      responses:
        "200":
          description: Command applied; returns events and the new state version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/agents/{npc_id}/decision:
    post:
      operationId: requestDecision
      description: Ask the agent runtime for a validated ActionProposal.
      parameters:
        - name: npc_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [observation]
              properties:
                observation:
                  $ref: "./npc-observation.v1.schema.json"
      responses:
        "200":
          description: Validated proposal or a documented fallback
          content:
            application/json:
              schema:
                $ref: "./action-proposal.v1.schema.json"
        "422":
          description: Proposal could not be validated; fallback applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/dialogue:
    post:
      operationId: dialogue
      description: Bounded in-character dialogue; returns text plus any proposal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [npc_id, player_id, message]
              properties:
                npc_id: { type: string, format: uuid }
                player_id: { type: string, format: uuid }
                message: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Dialogue response
          content:
            application/json:
              schema:
                type: object
                required: [reply_text, proposal]
                properties:
                  reply_text: { type: string }
                  proposal:
                    oneOf:
                      - $ref: "./action-proposal.v1.schema.json"
                      - type: "null"
        "422":
          $ref: "#/components/responses/BadRequest"

  /v1/voice/transcriptions:
    post:
      operationId: transcribeVoice
      description: >
        Optional speech-to-text transport only; never changes authoritative world state.
        Accepts raw nonempty PCM WAV with 16-bit samples, one or two channels,
        8000-48000 Hz, at most 30 seconds and 6291456 bytes including headers.
        The provider is configured on the server; no client credentials are accepted.
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
              description: Raw WAV bytes; not base64 or multipart.
            x-max-bytes: 6291456
            x-max-duration-seconds: 30
      responses:
        "200":
          description: Nonempty transcript; the player may edit before submitting dialogue.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [text]
                properties:
                  text: { type: string, minLength: 1, maxLength: 2000, pattern: '\S' }
        "413":
          $ref: "#/components/responses/VoiceTooLarge"
        "415":
          $ref: "#/components/responses/VoiceUnsupportedAudio"
        "422":
          $ref: "#/components/responses/VoiceInvalidInput"
        "502":
          $ref: "#/components/responses/VoiceProviderFailed"
        "503":
          $ref: "#/components/responses/VoiceNotConfigured"
        "504":
          $ref: "#/components/responses/VoiceProviderTimeout"

  /v1/voice/speech:
    post:
      operationId: synthesizeVoice
      description: >
        Optional text-to-speech transport only; never executes a proposal or changes
        world state. Synthesized speech must be identified as synthetic in the client.
        A playback failure must not repeat a dialogue request or world command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000, pattern: '\S' }
      responses:
        "200":
          description: >
            Raw nonempty PCM WAV, 16-bit, one or two channels, 8000-48000 Hz,
            at most 120 seconds and 12582912 bytes including headers.
          content:
            audio/wav:
              schema: { type: string, format: binary }
              x-max-bytes: 12582912
              x-max-duration-seconds: 120
        "422":
          $ref: "#/components/responses/VoiceInvalidInput"
        "502":
          $ref: "#/components/responses/VoiceProviderFailed"
        "503":
          $ref: "#/components/responses/VoiceNotConfigured"
        "504":
          $ref: "#/components/responses/VoiceProviderTimeout"

  /v1/saves:
    post:
      operationId: createSave
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 120 }
      responses:
        "201":
          description: Save created from a checksummed snapshot
          content:
            application/json:
              schema:
                type: object
                required: [save_id, snapshot_id, tick, checksum]
                properties:
                  save_id: { type: string, format: uuid }
                  snapshot_id: { type: string, format: uuid }
                  tick: { type: integer }
                  checksum: { type: string }

  /v1/saves/{save_id}/load:
    post:
      operationId: loadSave
      parameters:
        - name: save_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: State restored; subsequent events start after the save's snapshot
          content:
            application/json:
              schema:
                $ref: "./world-snapshot.v1.schema.json"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/debug/causality/{event_id}:
    get:
      operationId: getCausality
      description: Upstream causal chain for an event (debug/MVP inspection).
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        "200":
          description: Causal chain
          content:
            application/json:
              schema:
                type: object
                required: [root_event_id, events, edges]
                properties:
                  root_event_id: { type: integer }
                  events:
                    type: array
                    items:
                      $ref: "./world-event.v1.schema.json"
                  edges:
                    type: array
                    items:
                      type: object
                      required: [parent_event_id, child_event_id, relation]
                      properties:
                        parent_event_id: { type: integer }
                        child_event_id: { type: integer }
                        relation: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"

x-websocket:
  /v1/events/stream:
    description: >
      WebSocket stream. Server sends {"kind":"event","event":WorldEvent} frames
      ordered by event_id; on connect the client may pass ?after=<event_id>.
      Clients must tolerate reconnects and resume from their last event_id.

components:
  responses:
    VoiceTooLarge:
      description: audio_too_large; input byte or duration limit exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VoiceError" }
    VoiceUnsupportedAudio:
      description: unsupported_audio; wrong MIME type, PCM format, channels or sample rate.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VoiceError" }
    VoiceInvalidInput:
      description: invalid_audio or invalid_text; malformed/empty WAV or invalid JSON/text.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VoiceError" }
    VoiceProviderFailed:
      description: speech_provider_failed; upstream error or invalid/oversized provider output.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VoiceError" }
    VoiceNotConfigured:
      description: speech_not_configured; required provider URL, model or voice is absent.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VoiceError" }
    VoiceProviderTimeout:
      description: speech_provider_timeout; provider deadline exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VoiceError" }
    BadRequest:
      description: Invalid or rejected command
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Stale state version or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    VoiceError:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          enum:
            - audio_too_large
            - unsupported_audio
            - invalid_audio
            - invalid_text
            - speech_provider_failed
            - speech_not_configured
            - speech_provider_timeout
        message: { type: string }
        details: { type: object }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object }
    CommandResult:
      type: object
      required: [accepted, state_version, events]
      properties:
        accepted: { type: boolean }
        state_version: { type: integer }
        events:
          type: array
          items:
            $ref: "./world-event.v1.schema.json"
